[package]
name = "daily-log"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
rusty_ulid = "2"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
topcoat = "0.5.0"
sea-orm = { 
    version = "2.0.0", 
    features = [
        "sqlx-postgres",
        "runtime-tokio-native-tls", "with-uuid"
    ]
}