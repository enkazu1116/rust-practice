[package]
name = "daily-log"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["migration"]

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
regex = "1"
rusty_ulid = "2"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
axum = "0.8.9"
sea-orm = { 
    version = "2.0.0", 
    features = [
        "sqlx-postgres",
        "runtime-tokio-native-tls", "with-uuid"
    ]
}
serde_json = "1.0.154"
